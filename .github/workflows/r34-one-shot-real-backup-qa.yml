name: QA R3.4 one-shot backup lock recheck end-to-end
on:
  push:
    branches:
      - qa/r34-backup-locked-e2e-20261111
    paths:
      - '.github/workflows/r34-one-shot-real-backup-qa.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: qa-r34-backup-locked-e2e
  cancel-in-progress: false
jobs:
  once:
    if: github.repository == 'lijianjun004-star/tcl-live-monitor' && github.ref == 'refs/heads/qa/r34-backup-locked-e2e-20261111' && contains(github.event.head_commit.message, '[r34-e2e-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch a SINGLE MAIN backup workflow once
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "lijianjun004-star/tcl-live-monitor"
          gh api --method POST -H "Accept: application/vnd.github+json" "repos/${GITHUB_REPOSITORY}/actions/workflows/jd-r33-backup.yml/dispatches" -f ref=main
          echo "One R3.4 backup workflow_dispatch accepted. Verify separate MAIN run; this is NOT a natural schedule event."
