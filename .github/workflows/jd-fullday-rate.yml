name: JD fixed-window full-broadcast rate (08:00-24:00 Beijing, read-only)
# User instruction 2026-11-14 01:14 (Beijing): implement JD fully. JD rooms start between 07:00 and 08:00 and
# end between 24:00 and 01:00, so the required window is 08:00-24:00 (960 minutes) per Beijing day.
# Source: the authorized TCL OPS platform, GET only, allow-listed routes, about 8 requests per run.
# Independent of the existing JD patrol (jd-r23-scheduled / jd-r33-backup): shares no file, state or lock.
# Minute data is capture data: if capture breaks while the stream continues, the rate is under-counted.
on:
  schedule:
    - cron: '4,19,34 0 * * *'    # 08:04 / 08:19 / 08:34 Beijing: the first run inside 08:00-09:00 is the day's snapshot
    - cron: '34 16,17 * * *'     # 00:34 / 01:34 Beijing: final reading of the day that just ended
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: jd-fullday-rate
  cancel-in-progress: false
jobs:
  rate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TCL_OPS_BASE_URL: ${{ secrets.TCL_OPS_BASE_URL || 'http://101.96.215.251' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Offline tests before any source request
        run: node --test tests/r327/*.test.mjs
      - name: Restore the latest completed run including failures (no fallback)
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore-jd-fullday-state.sh
      - name: One read-only pass over the JD rooms (GET only, no retries)
        id: source
        continue-on-error: true
        env:
          JD_PREVIOUS_FILE: ${{ steps.restore.outputs.previous }}
        run: node probes/r327/jd-fullday-cli.mjs --previous "$JD_PREVIOUS_FILE" --state-output out/state.json --report-output out/report.json
      - name: Report (room ids, categories, dates, minutes and rates only)
        if: always() && steps.restore.outcome == 'success' && hashFiles('out/report.json') != '' && hashFiles('out/state.json.lock') == '' && hashFiles('out/.jd-history.lock') == ''
        run: |
          node -e "
          const r=require('./out/report.json');const f=x=>x===null||x===undefined?'—':x;const yn=x=>x===true?'是':x===false?'否':'—';
          const rate=x=>x.ratePercent!==null?x.ratePercent+'%':x.rangePercent?x.routineAssumedRangePercent[0]+'%–'+x.routineAssumedRangePercent[1]+'%（估算：缺 8 点快照，按 7–8 点开播、0–1 点下播推算；不依赖该假设的范围是 '+x.rangePercent[0]+'%–'+x.rangePercent[1]+'%）':x.soFarMinutes!==null?'当天进行中（全天已有 '+x.soFarMinutes+' 分钟）':'—';
          const rows=r.rows.map(x=>'| '+[x.date,'jd-'+x.roomId+' '+(x.category||''),f(x.inWindowMinutes),rate(x),yn(x.liveByWindowStart),f(x.lastMinuteBeijing),yn(x.reachedWindowEnd)].join(' | ')+' |');
          const md=['## 京东历史采集分钟覆盖估算（08:00–24:00，北京时间）','','非正式满播率或考核结果；缺样不代表停播，历史观测不代表当前状态。','本轮来源：'+r.sourceStatus+'；最近有效来源：'+(r.lastSuccessfulSourceAt||'UNKNOWN'),'来源失败时保留的历史估算可能已过期。','','| 日期 | 直播间 | 估算时段内分钟（满 960） | 覆盖估算 | 8 点信号 | 当天最后一分钟 | 末段信号 |','|---|---|---|---|---|---|---|',...rows,''].join('\n');
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,md);
          for(const x of r.rows) console.log('R327_JD_DAY '+JSON.stringify(x));"
      - name: Save rolling state and report (7 days)
        id: save
        if: always() && (hashFiles('out/state.json') != '' || hashFiles('out/state.json.lock') != '' || hashFiles('out/.jd-history.lock') != '' || hashFiles('out/recovery-block.json') != '')
        uses: actions/upload-artifact@v4
        with:
          name: jd-fullday-state
          path: |
            out/state.json
            out/report.json
            out/state.json.lock
            out/.jd-history.lock
            out/recovery-block.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
      - name: Final source and persistence gate
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
        run: |
          set -euo pipefail
          test "$RESTORE_OUTCOME" = success
          test "$SOURCE_OUTCOME" = success
          test "$SAVE_OUTCOME" = success
          test -f out/state.json
          test -f out/report.json
          test ! -e out/state.json.lock
          test ! -e out/.jd-history.lock
          test ! -e out/recovery-block.json
