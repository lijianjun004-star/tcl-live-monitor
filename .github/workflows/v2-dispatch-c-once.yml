name: Dispatch V2 acceptance C once
on:
  push:
    branches: [codex/v2-acceptance-live-c-4f9e2a94]
    paths: ['.github/workflows/v2-dispatch-c-once.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.event.before == '4f9e2a9416e858335a2170974c86fd811dd3d595' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify the feature tip and dispatch one live run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feat/v2-modular-architecture" --jq .object.sha)" = '4f9e2a9416e858335a2170974c86fd811dd3d595'
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/425072647/dispatches" \
            -f ref='feat/v2-modular-architecture' -f 'inputs[engine]=live' \
            -f 'inputs[fail_on_canary]=true'
