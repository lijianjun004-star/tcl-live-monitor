name: R2.1 JD today delivery quality gate (offline)
on:
  push:
    branches:
      - experiment/r21-jd-today-delivery
    paths:
      - '.github/workflows/r21-jd-quality.yml'
      - 'probes/r21/**'
      - 'preview/jd/**'
      - 'tests/r21-*.test.mjs'
      - 'docs/r21/**'
  pull_request:
    paths:
      - '.github/workflows/r21-jd-quality.yml'
      - 'probes/r21/**'
      - 'preview/jd/**'
      - 'tests/r21-*.test.mjs'
      - 'docs/r21/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full existing and R2.1 regression
        run: node --test tests/*.test.mjs
      - name: Make formal JD readiness evidence
        run: node probes/r20/jd-opening-rate-cli.mjs --as-of 2026-11-10T12:00:00Z --out r21-formal-readiness.json
      - name: Reject fabricated rate and auto-scheduled deployment
        run: |
          node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('r21-formal-readiness.json','utf8'));if(x.formal_report_ready!==false||x.observed_real_jd_opening_rate!==null||x.opening_rate_percent!==null||x.readiness.verified_public_jd_accounts!==0||x.readiness.imported_schedule_shifts!==0)process.exit(2);console.log('PASS: no fabricated formal JD opening rate');"
          if grep -qi 'schedule:' .github/workflows/r21-jd-real-source-one-shot.yml; then
            echo "No production cron permitted"; exit 2
          fi
      - name: Build complete versioned source ZIP from tracked project files
        run: git archive --format=zip --output=r21-jd-full-source.zip HEAD
      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: r21-jd-full-source
          path: r21-jd-full-source.zip
          retention-days: 21
          if-no-files-found: error
      - name: Upload deployable standalone preview and MD handoff
        uses: actions/upload-artifact@v4
        with:
          name: r21-jd-mobile-preview-delivery
          path: |
            preview/jd/index.html
            docs/r21/*.md
            r21-formal-readiness.json
          retention-days: 21
          if-no-files-found: error
