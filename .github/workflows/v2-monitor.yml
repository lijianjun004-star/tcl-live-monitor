name: TCL V2 monitor

on:
  # Asia/Shanghai: 08:00, 08:30, ..., 23:30, then midnight.
  schedule:
    - cron: '0,30 0-15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      engine:
        description: fake = offline dry run, live = real public pages (uses secrets)
        type: choice
        options: [fake, live]
        default: fake
      fail_on_canary:
        description: Fail the job when the JD positive control is not live
        type: boolean
        default: true
      restore_state_run_id:
        description: Earlier successful run of this workflow on this branch whose v2-state to continue
        type: string
        required: false
      continue_main_state:
        description: Continue the latest successful main state like a scheduled run (used by the external clock)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: tcl-v2-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    uses: ./.github/workflows/v2-offline.yml

  live:
    needs: offline
    if: (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.engine == 'live')
    # Repository variable V2_RUNNER=self-hosted moves this job to the operator's own computer
    # (docs/v2/SELF_HOSTED_PC_RUNBOOK.md); unset, it stays on GitHub's ubuntu-24.04 runner.
    runs-on: ${{ vars.V2_RUNNER == 'self-hosted' && fromJSON('["self-hosted","tcl-pc"]') || 'ubuntu-24.04' }}
    # Room checks take a few minutes; a person may need up to 3 x 5 minutes for challenges.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore latest successful main live state
        # The external clock (external/cloudflare-v2-clock) dispatches with continue_main_state, because
        # GitHub delivers this repository's schedule events only a few times a day.
        if: >-
          github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
          && inputs.continue_main_state && inputs.restore_state_run_id == '' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_v2_state.py
      - name: Install Chromium
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi
      - name: Download cloudflared for phone verification (quick tunnel, no account)
        if: vars.HUMAN_VERIFY == '1'
        continue-on-error: true
        run: |
          base=https://github.com/cloudflare/cloudflared/releases/latest/download
          case "$RUNNER_OS" in
            Windows) file=cloudflared.exe; curl -fsSL -o "$file" "$base/cloudflared-windows-amd64.exe" ;;
            macOS) file=cloudflared; curl -fsSL "$base/cloudflared-darwin-$( [[ "$(uname -m)" == arm64 ]] && echo arm64 || echo amd64 ).tgz" | tar -xz ;;
            *) file=cloudflared; curl -fsSL -o "$file" "$base/cloudflared-linux-amd64" ;;
          esac
          chmod +x "$file"
          "./$file" --version
          echo "HUMAN_VERIFY_TUNNEL=./$file" >> "$GITHUB_ENV"
      - name: Restore chosen state (cache, previous snapshot, notify ledger)
        if: github.event_name == 'workflow_dispatch' && inputs.restore_state_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_RUN_ID: ${{ inputs.restore_state_run_id }}
        run: |
          [[ "$STATE_RUN_ID" =~ ^[0-9]{1,20}$ && "$STATE_RUN_ID" != "$GITHUB_RUN_ID" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STATE_RUN_ID" |
            jq -e --arg branch "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" '
              .head_branch == $branch and .head_repository.full_name == $repo
              and .path == ".github/workflows/v2-monitor.yml"
              and .status == "completed" and .conclusion == "success"
            ' >/dev/null
          gh run download "$STATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name v2-state --dir state
          if [[ ! -f state/monitor_snapshot.json ]]; then
            # A first run with pending, unsent alerts has a cache and an empty ledger.
            jq -es 'length == 1 and (.[0].entries | type == "object")' state/resolved_cache.json >/dev/null
            jq -es 'length == 1 and .[0].sent == {}' state/notify_ledger.json >/dev/null
          fi
      - name: Live V2 run
        id: collect
        env:
          V2_TARGETS_JSON: ${{ secrets.V2_TARGETS_JSON }}
          ALI_COOKIE_GROUP_1: ${{ secrets.ALI_COOKIE_GROUP_1 }}
          ALI_COOKIE_GROUP_2: ${{ secrets.ALI_COOKIE_GROUP_2 }}
          ALI_COOKIE_GROUP_3: ${{ secrets.ALI_COOKIE_GROUP_3 }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_KIND: ${{ secrets.WEBHOOK_KIND }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          FAIL_ON_CANARY: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_on_canary }}
          # Phone verification of slider / drawn-path challenges (src/core/human_verify.py).
          # Off by default: on GitHub-hosted runners Taobao did not accept a person's slider
          # (run 45086892501). Set the repository variable HUMAN_VERIFY to 1 on a trusted runner.
          HUMAN_VERIFY: ${{ vars.HUMAN_VERIFY == '1' && '1' || '0' }}
          # V2_HEADED=1 runs a normal windowed browser (needs a logged-in desktop on a self-hosted runner).
          V2_HEADED: ${{ vars.V2_HEADED }}
          PYTHONUNBUFFERED: '1'
        run: |
          flag=""
          if [[ "$FAIL_ON_CANARY" == "true" ]]; then flag="--fail-on-canary"; fi
          python src/v2_run.py --engine live --out v2-evidence --state-dir state --dashboard docs/index.html $flag
      - name: Verify evidence checksums
        if: always()
        working-directory: v2-evidence
        run: sha256sum --strict --check SHA256SUMS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TCL_V2_Evidence_${{ github.run_id }}_a${{ github.run_attempt }}
          path: v2-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload state for the next run
        # A failed rerun must not replace a previous successful attempt's archive.
        if: ${{ success() || (!cancelled() && github.run_attempt == '1' && steps.collect.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: v2-state
          overwrite: true
          path: state/
          retention-days: 7
          if-no-files-found: error
