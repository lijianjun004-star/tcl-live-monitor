name: TCL V2 monitor

on:
  push:
    branches:
      - feat/v2-modular-architecture
    paths:
      - '.github/workflows/v2-monitor.yml'
      - 'src/**'
      - 'tests/v2/**'
      - 'schemas/**'
      - 'config/targets.example.json'
      - 'SPEC.md'
      - 'pytest.ini'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      engine:
        description: fake = offline dry run, live = real public pages (uses secrets)
        type: choice
        options: [fake, live]
        default: fake
      fail_on_canary:
        description: Fail the job when the JD positive control is not live
        type: boolean
        default: true
      restore_state_run_id:
        description: Earlier successful run of this workflow on this branch whose v2-state to continue
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: tcl-v2-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Legacy JD probe self-test (must stay green)
        run: python src/single_room_probe.py --self-test
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Offline pytest (browser tests answer every request locally)
        run: python -m pytest
      - name: Fake-engine dry run on the example targets
        run: >-
          python src/v2_run.py --targets config/targets.example.json --engine fake
          --out v2-evidence --state-dir state --dashboard docs/index.html --no-notify --no-drive
      - name: Verify evidence checksums
        working-directory: v2-evidence
        run: sha256sum --strict --check SHA256SUMS.txt
      - name: Upload dry-run evidence
        uses: actions/upload-artifact@v7
        with:
          name: TCL_V2_DryRun_${{ github.run_id }}_a${{ github.run_attempt }}
          path: v2-evidence/
          retention-days: 7
          if-no-files-found: error

  live:
    needs: offline
    if: github.event_name == 'workflow_dispatch' && inputs.engine == 'live'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Restore chosen state (cache, previous snapshot, notify ledger)
        if: ${{ inputs.restore_state_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_RUN_ID: ${{ inputs.restore_state_run_id }}
        run: |
          [[ "$STATE_RUN_ID" =~ ^[0-9]{1,20}$ && "$STATE_RUN_ID" != "$GITHUB_RUN_ID" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STATE_RUN_ID" |
            jq -e --arg branch "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" '
              .head_branch == $branch and .head_repository.full_name == $repo
              and .path == ".github/workflows/v2-monitor.yml"
              and .status == "completed" and .conclusion == "success"
            ' >/dev/null
          gh run download "$STATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name v2-state --dir state
          test -f state/monitor_snapshot.json
      - name: Live V2 run
        env:
          V2_TARGETS_JSON: ${{ secrets.V2_TARGETS_JSON }}
          ALI_COOKIE_GROUP_1: ${{ secrets.ALI_COOKIE_GROUP_1 }}
          ALI_COOKIE_GROUP_2: ${{ secrets.ALI_COOKIE_GROUP_2 }}
          ALI_COOKIE_GROUP_3: ${{ secrets.ALI_COOKIE_GROUP_3 }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_KIND: ${{ secrets.WEBHOOK_KIND }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          FAIL_ON_CANARY: ${{ inputs.fail_on_canary }}
          PYTHONUNBUFFERED: '1'
        run: |
          flag=""
          if [[ "$FAIL_ON_CANARY" == "true" ]]; then flag="--fail-on-canary"; fi
          python src/v2_run.py --engine live --out v2-evidence --state-dir state --dashboard docs/index.html $flag
      - name: Verify evidence checksums
        if: always()
        working-directory: v2-evidence
        run: sha256sum --strict --check SHA256SUMS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TCL_V2_Evidence_${{ github.run_id }}_a${{ github.run_attempt }}
          path: v2-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload state for the next run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-state
          path: state/
          retention-days: 7
          if-no-files-found: warn
