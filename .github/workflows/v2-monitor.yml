name: TCL V2 monitor

on:
  workflow_dispatch:
    inputs:
      engine:
        description: fake = offline, live = V2 monitor, jd-storefront = three JD entrances
        type: choice
        options: [fake, live, jd-storefront]
        default: fake
      jd_raw_origin:
        description: Original host of a raw iPhone Cookie (ignored for scoped JSON)
        type: choice
        options: [item.m.jd.com, shop.m.jd.com]
        default: item.m.jd.com
      fail_on_canary:
        description: Fail the job when the JD positive control is not live
        type: boolean
        default: true
      restore_state_run_id:
        description: Earlier successful run of this workflow on this branch whose v2-state to continue
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: tcl-v2-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    uses: ./.github/workflows/v2-offline.yml

  live:
    needs: offline
    if: github.event_name == 'workflow_dispatch' && inputs.engine == 'live'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Restore chosen state (cache, previous snapshot, notify ledger)
        if: ${{ inputs.restore_state_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_RUN_ID: ${{ inputs.restore_state_run_id }}
        run: |
          [[ "$STATE_RUN_ID" =~ ^[0-9]{1,20}$ && "$STATE_RUN_ID" != "$GITHUB_RUN_ID" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STATE_RUN_ID" |
            jq -e --arg branch "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" '
              .head_branch == $branch and .head_repository.full_name == $repo
              and .path == ".github/workflows/v2-monitor.yml"
              and .status == "completed" and .conclusion == "success"
            ' >/dev/null
          gh run download "$STATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name v2-state --dir state
          if [[ ! -f state/monitor_snapshot.json ]]; then
            # A first run with pending, unsent alerts has a cache and an empty ledger.
            jq -es 'length == 1 and (.[0].entries | type == "object")' state/resolved_cache.json >/dev/null
            jq -es 'length == 1 and .[0].sent == {}' state/notify_ledger.json >/dev/null
          fi
      - name: Live V2 run
        env:
          V2_TARGETS_JSON: ${{ secrets.V2_TARGETS_JSON }}
          ALI_COOKIE_GROUP_1: ${{ secrets.ALI_COOKIE_GROUP_1 }}
          ALI_COOKIE_GROUP_2: ${{ secrets.ALI_COOKIE_GROUP_2 }}
          ALI_COOKIE_GROUP_3: ${{ secrets.ALI_COOKIE_GROUP_3 }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_KIND: ${{ secrets.WEBHOOK_KIND }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          FAIL_ON_CANARY: ${{ inputs.fail_on_canary }}
          PYTHONUNBUFFERED: '1'
        run: |
          flag=""
          if [[ "$FAIL_ON_CANARY" == "true" ]]; then flag="--fail-on-canary"; fi
          python src/v2_run.py --engine live --out v2-evidence --state-dir state --dashboard docs/index.html $flag
      - name: Verify evidence checksums
        if: always()
        working-directory: v2-evidence
        run: sha256sum --strict --check SHA256SUMS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TCL_V2_Evidence_${{ github.run_id }}_a${{ github.run_attempt }}
          path: v2-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload state for the next run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-state
          path: state/
          retention-days: 7
          if-no-files-found: warn

  jd-storefront:
    needs: offline
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/experiment/jd-cookie-live-discovery' && inputs.engine == 'jd-storefront'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Read the three fixed storefronts
        env:
          JD_COOKIES_JSON: ${{ secrets.JD_COOKIES_JSON }}
          JD_RAW_ORIGIN: ${{ inputs.jd_raw_origin || 'item.m.jd.com' }}
          PYTHONPATH: src
        run: python -m experiments.jd_cookie_live.manual --out jd-storefront-evidence
      - name: Verify the report files
        id: verify
        if: ${{ !cancelled() && hashFiles('jd-storefront-evidence/SHA256SUMS.txt') != '' }}
        working-directory: jd-storefront-evidence
        run: sha256sum --strict --check SHA256SUMS.txt
      - name: Upload the verified reports
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: JD_Storefront_${{ github.run_id }}_a${{ github.run_attempt }}
          path: |
            jd-storefront-evidence/jd_cookie_experiment_result.json
            jd-storefront-evidence/summary.md
            jd-storefront-evidence/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
