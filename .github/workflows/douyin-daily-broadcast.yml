name: Douyin daily broadcast check (4 scoring accounts, read-only public guest)
# User approval 2026-11-14 01:04 (Beijing): merge to main and sample on a schedule, every 2 hours in the
# daytime, the 4 scoring accounts first. Public guest only: mobile viewport, no login, no cookies supplied,
# only the two core CDNs for JS/CSS, at most 2 pages per account (profile + its own live room).
# Stops at once on 401/403/429, verification or login redirect, then stays away for 24 hours.
# "Not seen in samples" is never "did not broadcast". UNKNOWN is never OFFLINE. No scoring, no penalties.
on:
  schedule:
    - cron: '17 0-16/2 * * *'   # 08:17 to 00:17 Beijing time, every 2 hours (GitHub cron is best effort)
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: douyin-daily-broadcast
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Offline guard, identity, ledger and daily-result tests before any live request
        run: node --test tests/r320/network-identity-offline.test.mjs tests/r322/*.test.mjs tests/r323/*.test.mjs tests/r324/*.test.mjs tests/r325/*.test.mjs tests/r326/*.test.mjs
      - name: Restore the previous 7-day ledger (latest successful run of this workflow)
        run: |
          mkdir -p out/ledger prev
          ID=$(gh run list --workflow douyin-daily-broadcast.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$ID" ] && gh run download "$ID" -n douyin-daily-ledger -D prev; then
            if [ -f prev/state.json ]; then cp prev/state.json out/ledger/state.json; fi
            if [ -f prev/cooldown.json ]; then cp prev/cooldown.json out/ledger/cooldown.json; fi
          fi
          if [ -f out/ledger/state.json ] && ! node probes/r325/daily-report.mjs out/ledger/state.json > /dev/null; then
            echo "::warning::previous ledger failed validation and was not used; starting a new one"
            rm -f out/ledger/state.json
          fi
          echo "restored: $([ -f out/ledger/state.json ] && echo yes || echo no)"
      - name: Cooldown gate (24 hours without any live request after an access limit)
        id: gate
        run: |
          node -e "
          const fs=require('fs');let skip=false,why='none';
          try{const c=JSON.parse(fs.readFileSync('out/ledger/cooldown.json','utf8'));const age=Date.now()-Date.parse(c.stoppedAt);
            if(Number.isFinite(age)&&age>=0&&age<24*3600e3){skip=true;why='ACCESS_LIMIT_COOLDOWN';}
            else fs.rmSync('out/ledger/cooldown.json');}catch{}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'skip='+skip+'\n');console.log(JSON.stringify({skip,why}));"
      - name: Install pinned Playwright Chromium
        if: steps.gate.outputs.skip != 'true'
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: One read-only pass over the 4 scoring accounts (two fixed sets of two)
        if: steps.gate.outputs.skip != 'true'
        env:
          R316_RPA_ONCE: TWO_ACCOUNTS_ONE_PASS
          R319_CORE_CDN_APPROVED_ONCE: TWO_APPROVED_CDNS_JS_CSS_ONLY
        run: |
          pass() {  # $1 = label, $2 = target set
            set +e; R326_TARGET_SET="$2" node probes/r316/douyin-rpa-two-once.mjs; code=$?; set -e
            test -f out/r316-rpa-public.json || { echo "::error::probe produced no receipt"; exit 1; }
            mv out/r316-rpa-public.json "out/receipt-$1.json"
            if [ -d out/r316-private ]; then mv out/r316-private "out/private-$1"; fi
            node probes/r322/import-receipt.mjs --receipt "out/receipt-$1.json" --state out/ledger/state.json --html out/ledger/index.html --evidence-kind real || { echo "::error::receipt import failed"; exit 1; }
            return $code
          }
          stopped=0
          pass a "" || stopped=1
          if [ "$stopped" = 0 ]; then sleep 5; pass b SCORING_B || stopped=1; fi
          if [ "$stopped" = 1 ]; then
            node -e "require('fs').writeFileSync('out/ledger/cooldown.json',JSON.stringify({stoppedAt:new Date().toISOString()}))"
            echo "::warning::Douyin access limit or stop condition: this run stopped at once; no live request for the next 24 hours. This is missing sampling, NOT evidence of OFFLINE."
          fi
      - name: Daily result (account keys, Beijing dates, statuses and sample times only)
        if: always() && hashFiles('out/ledger/state.json') != ''
        run: |
          node probes/r325/daily-report.mjs out/ledger/state.json | tee out/daily.txt
          node -e "
          const L=require('fs').readFileSync('out/daily.txt','utf8').split('\n').filter(l=>l.startsWith('R325_DAILY {')).map(l=>JSON.parse(l.slice(11)));
          const s={BROADCAST_SEEN:'已开播',NOT_SEEN_IN_SAMPLES:'采样中未见开播（不等于没播）',UNKNOWN:'无法判断'};
          const t=x=>x?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(x)):'—';
          const rows=L.map(d=>'| '+[d.date,d.key,s[d.status],d.firstSeenAt?t(d.firstSeenAt)+'–'+t(d.lastSeenAt):'—',d.verifiedSamples].join(' | ')+' |');
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,['## 抖音每日开播（北京时间）','','每天按 06:00 到次日 06:00 计算：凌晨 0–6 点看到的在播算前一天那一场。','','| 日期 | 账号 | 结果 | 看到在播（采样时刻） | 核验采样次数 |','|---|---|---|---|---|',...rows,''].join('\n'));"
      - name: Encrypt private page evidence, never upload plaintext
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ls -d out/private-* > /dev/null 2>&1 || exit 0
          mkdir -p out/enc
          tar czf p.tgz -C out $(cd out && ls -d private-*) && rm -rf out/private-*
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in p.tgz -out out/enc/p.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey probes/keys/analysis-pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out out/enc/k.enc
          rm -f p.tgz k.bin
      - name: Save the 7-day ledger, offline view and cooldown marker
        if: always() && hashFiles('out/ledger/state.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: douyin-daily-ledger
          path: |
            out/ledger/state.json
            out/ledger/index.html
            out/ledger/cooldown.json
          retention-days: 7
          if-no-files-found: error
      - name: Save encrypted private evidence (7 days; readable only with the offline private key)
        if: always() && hashFiles('out/enc/p.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: douyin-daily-private-encrypted
          path: out/enc/
          retention-days: 7
