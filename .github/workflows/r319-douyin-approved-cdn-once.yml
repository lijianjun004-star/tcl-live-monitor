name: R3.19 Douyin approved core CDN public guest observation - ONE PASS
# Explicit user-approved single-use live verification, 2026-11-13; do not rerun.
on:
  push:
    branches: [experiment/r319-douyin-core-cdn-approved-once-20261113]
    paths: ['.github/workflows/r319-douyin-approved-cdn-once.yml']
permissions:
  contents: read
concurrency:
  group: r319-douyin-approved-cdn-once
  cancel-in-progress: false
jobs:
  rpa:
    # An explicit one-time commit marker is required; manual reruns must skip.
    if: github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[r319-cdn-rpa-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Offline scope, privacy and resource-gate verification
        run: |
          node --test tests/r318/douyin-static-identity.test.mjs tests/r319/douyin-approved-cdn.test.mjs
      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Run ONE approved read-only pass (two pre-registered accounts at most)
        env:
          R316_RPA_ONCE: TWO_ACCOUNTS_ONE_PASS
          R319_CORE_CDN_APPROVED_ONCE: TWO_APPROVED_CDNS_JS_CSS_ONLY
        run: node probes/r316/douyin-rpa-two-once.mjs
      - name: Encrypt private page evidence, never upload plaintext
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d out/r316-private || exit 0
          tar czf p.tgz -C out r316-private && rm -rf out/r316-private
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in p.tgz -out p.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey probes/keys/analysis-pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out k.enc
          rm -f p.tgz k.bin
          echo "KEY_BEGIN"; base64 -w 0 k.enc; echo; echo "KEY_END"
          echo "DATA_BEGIN"; base64 -w 0 p.enc; echo; echo "DATA_END"
      - name: Save sanitized public receipt for independent verification (7 days)
        if: always() && hashFiles('out/r316-rpa-public.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: r319-douyin-cdn-readonly-${{ github.run_id }}
          path: out/r316-rpa-public.json
          retention-days: 7
          if-no-files-found: error
