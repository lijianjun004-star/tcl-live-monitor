name: R3.16 offline gate - tests, workflow syntax, privacy scan (no network)
on:
  pull_request:
    paths: ['probes/**', 'tests/**', 'config/**', 'docs/r316/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: R3.16 dedicated tests
        run: node --test tests/r316/*.test.mjs
      - name: R3.18 static resource and identity tests (offline only)
        run: node --test tests/r318/*.test.mjs
      - name: R3.19 approved CDN scope and once-only guards (offline only)
        run: node --test tests/r319/*.test.mjs
      - name: R3.20 Gemini P1/P2/P3 adversarial tests (offline only)
        run: node --test tests/r320/network-identity-offline.test.mjs
      - name: R3.21 Claude+Gemini review regressions (offline only)
        run: node --test tests/r321/*.test.mjs
      - name: R3.22 observation ledger and offline view tests
        run: node --test tests/r322/*.test.mjs
      - name: R3.23 live-path calibration tests from approved real run (offline only)
        run: node --test tests/r323/*.test.mjs
      - name: R3.24 raw-HTML calibration diagnostics tests (offline only)
        run: node --test tests/r324/*.test.mjs
      - name: R3.25 daily "broadcast today?" and replay diagnostics tests (offline only)
        run: node --test tests/r325/*.test.mjs
      - name: Full repository regression
        run: node --test tests/*.test.mjs tests/r315/*.test.mjs tests/r316/*.test.mjs tests/r318/*.test.mjs tests/r319/*.test.mjs tests/r320/*.test.mjs tests/r321/*.test.mjs tests/r322/*.test.mjs tests/r323/*.test.mjs tests/r324/*.test.mjs tests/r325/*.test.mjs
      - name: Workflow YAML syntax (every workflow file)
        run: |
          python3 - <<'PY'
          import glob, yaml, sys
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  d = yaml.safe_load(open(f))
                  assert isinstance(d, dict) and 'jobs' in d and (True in d or 'on' in d)
              except Exception as e:
                  bad.append((f, str(e)[:80]))
          print('workflows checked:', len(glob.glob('.github/workflows/*.yml')), 'bad:', bad)
          sys.exit(1 if bad else 0)
          PY
      - name: Chromium loopback-only no-redirect and no-worker security tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
          R320_BROWSER_SMOKE=1 node --test tests/r320/browser-redirect.test.mjs tests/r321/claude-browser-offline.test.mjs tests/r323/structure-browser.test.mjs tests/r325/replay-browser.test.mjs
      - name: R3.22/R3.23 sealed end-to-end - real probe to receipt to ledger, 5 scenarios (loopback only, no external network)
        # Runs probes/r316/douyin-rpa-two-once.mjs against a loopback stand-in inside a NEW network namespace
        # that is checked to have no route out before the probe starts (tests/r322/e2e/run-sealed-e2e.sh).
        run: sh tests/r322/e2e/run-sealed-e2e.sh /tmp/r322-sealed-e2e
      - name: Upload sealed end-to-end synthetic receipts, ledger and page (7 days)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r322-sealed-e2e-synthetic-${{ github.event.pull_request.head.sha }}
          path: /tmp/r322-sealed-e2e/
          retention-days: 7
          if-no-files-found: error
      - name: Privacy scan of tracked public files
        run: |
          set -euo pipefail
          ! git grep -nE 'BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY' -- . ':!tests/**'
          ! git grep -nE 'bound_session_key"?\s*:\s*"[A-Za-z0-9]' -- . ':!tests/**'
          ! git grep -nE 'live_room_id=[0-9]' -- docs
          echo "privacy scan: no private key, no session key value, no internal ids in docs"
      - name: Export exact PR-head tracked source snapshot for offline independent review
        if: success() && startsWith(github.event.pull_request.head.ref, 'fix/r321-')
        run: |
          set -euo pipefail
          mkdir -p /tmp/r321-review-source
          git archive --format=zip HEAD -o /tmp/r321-review-source/R321_Full_PR_Head_Source.zip
          git rev-parse HEAD > /tmp/r321-review-source/COMMIT_SHA.txt
          (cd /tmp/r321-review-source && sha256sum R321_Full_PR_Head_Source.zip > SHA256SUMS.txt)
          cat /tmp/r321-review-source/COMMIT_SHA.txt
          cat /tmp/r321-review-source/SHA256SUMS.txt
      - name: Upload exact PR-head full source ZIP and hashes (7 days)
        if: success() && startsWith(github.event.pull_request.head.ref, 'fix/r321-')
        uses: actions/upload-artifact@v4
        with:
          name: r321-full-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/r321-review-source/
          retention-days: 7
          if-no-files-found: error
