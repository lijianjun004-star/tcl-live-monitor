name: Remote slider practice (one-shot, practice page only)
# Branch-scoped push trigger for one experiment run. Never opens a third-party site. Remove after use.
on:
  push:
    branches:
      - claude/shop-livestream-access-ff953r
    paths:
      - experiments/remote_slider/**
      - .github/workflows/remote-slider-practice.yml
permissions:
  contents: read
concurrency:
  group: remote-slider-practice
  cancel-in-progress: true
jobs:
  practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Download cloudflared (quick tunnel, no account)
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared --version
      - name: Practice slider through the phone
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_KIND: ${{ secrets.WEBHOOK_KIND }}
          PYTHONUNBUFFERED: '1'
        run: python experiments/remote_slider/practice.py
