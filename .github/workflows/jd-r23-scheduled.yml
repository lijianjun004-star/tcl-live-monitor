name: R2.7 JD scheduled background monitor (daily 90d checkpoint)
# MAIN-branch state isolation; scan implementation is SHA-pinned and read-only.
# No Pages/site files altered. No repository write permissions.
on:
  push:
    branches:
      - main
      - release/r23-jd-scheduler-only
    paths:
      - '.github/workflows/jd-r23-scheduled.yml'
  pull_request:
    paths:
      - '.github/workflows/jd-r23-scheduled.yml'
  workflow_dispatch:
  schedule:
    # Offset +2 minutes from whole-hour congestion; preserves 5/15-minute intervals.
    - cron: '2,7,12,17,32,47,57 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: r23-jd-stateful-monitor
  cancel-in-progress: false
jobs:
  verify-launcher:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 267b6709a8563ef779cda6b11c97b9684c4e1c16
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned-source state machine and safety guards
        run: node --test tests/*.test.mjs
  verify-restore-isolation:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify MAIN-only artifact selection with adversarial fixtures
        run: node --test tests/r24-main-artifact-restore.test.mjs tests/r26-jd-main-smoke.test.mjs tests/r27-schedule-daily-archive.test.mjs
  inspect:
    # A main-branch smoke scan is allowed only for a labelled one-time release commit.
    # Normal main pushes and all pull requests cannot access source or persist state.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[jd-main-smoke]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TCL_OPS_BASE_URL: ${{ secrets.TCL_OPS_BASE_URL || 'http://101.96.215.251' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 267b6709a8563ef779cda6b11c97b9684c4e1c16
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce Beijing 06:30 to 02:00 window
        id: window
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {isOperatingTime,beijingClock} from './probes/r23/jd-window.mjs';
          const scheduled=process.env.GITHUB_EVENT_NAME==='schedule';
          const due=!scheduled||isOperatingTime(new Date());
          const clock=beijingClock(new Date());
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'should_run='+String(due)+'\n');
          console.log(JSON.stringify({scheduled,should_run:due,beijing_hour:clock.hour,beijing_minute:clock.minute,
            cron_offset_minutes:2,timetable:'06:30-02:00 BJT, shifted +2m, GitHub cron best effort'}));
          JS
      - name: Restore latest 7-day rolling state from Actions artifact
        id: restore
        if: steps.window.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=r24-jd-main-state&per_page=100" --jq '.artifacts | map(select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.repository_id != null and .workflow_run.repository_id == .workflow_run.head_repository_id)) | sort_by(.created_at) | last | .id // empty')
          if test -n "$artifact_id"; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > prior-state.zip
            unzip -p prior-state.zip r23-state.json > r23-previous.json
            node --input-type=module -e "import fs from 'node:fs';const s=JSON.parse(fs.readFileSync('r23-previous.json','utf8'));if(s.schema_version!==23||!s.rooms||!Array.isArray(s.events))process.exit(2);console.log('Restored previous run state; no reset');"
          else
            echo "No eligible MAIN-branch state artifact; experimental artifacts were not imported."
          fi
      - name: One authorized TCL OPS source scan (no retries)
        id: source
        if: steps.window.outputs.should_run == 'true' && steps.restore.outcome == 'success'
        continue-on-error: true
        run: node probes/tcl-jd-all.mjs --shard-index 0 --shard-total 1 --output r23-source-safe.json
      - name: Validate one scan (partial directory stays partial)
        id: accepted
        if: steps.window.outputs.should_run == 'true' && steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          if test -f r23-source-safe.json; then
            node probes/r21/accept-cli.mjs r23-source-safe.json r23-accepted.json
          else
            echo '{"schema_version":21,"readiness":"BLOCKED","reason":"SOURCE_REPORT_MISSING","rooms":[],"formal_opening_rate_percent":null}' > r23-accepted.json
            exit 3
          fi
      - name: Carry state forward; mark failed/unknown signals UNKNOWN
        id: state
        if: steps.window.outputs.should_run == 'true' && steps.restore.outcome == 'success'
        run: |
          node probes/r23/run-history.mjs --report r23-accepted.json --previous r23-previous.json --state-output r23-state.json --summary-output r23-summary.json --run-id "${{ github.run_id }}.${{ github.run_attempt }}"
      - name: Upload rolling history and sanitized snapshot
        if: always() && steps.window.outputs.should_run == 'true' && steps.state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r24-jd-main-state
          path: |
            r23-state.json
            r23-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Check if today's 90-day history checkpoint already exists
        id: dailycheck
        if: steps.window.outputs.should_run == 'true' && steps.state.outcome == 'success' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          checkpoint_name="r27-jd-daily-$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${checkpoint_name}&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.repository_id != null and .workflow_run.repository_id == .workflow_run.head_repository_id)] | length')
          echo "name=${checkpoint_name}" >> "${GITHUB_OUTPUT}"
          if test "${count}" = 0; then
            echo "should_upload=true" >> "${GITHUB_OUTPUT}"
            echo "New Beijing-day checkpoint: ${checkpoint_name}"
          else
            echo "should_upload=false" >> "${GITHUB_OUTPUT}"
            echo "Existing Beijing-day checkpoint: ${checkpoint_name}; avoiding duplicate archive"
          fi
      - name: Upload one daily 90-day immutable checkpoint
        id: dailyupload
        if: steps.dailycheck.outputs.should_upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dailycheck.outputs.name }}
          path: |
            r23-state.json
            r23-summary.json
          retention-days: 90
          if-no-files-found: error
      - name: Write safe run proof to Actions job summary
        if: always() && steps.window.outputs.should_run == 'true'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let summary = null;
          try { summary = JSON.parse(fs.readFileSync('r23-summary.json','utf8')); }
          catch { /* No data: provenance stays unknown. */ }
          const lines = [
            '## JD R2.6 main-chain execution proof',
            '- Event: `' + process.env.GITHUB_EVENT_NAME + '`',
            '- Branch: `' + process.env.GITHUB_REF + '`',
            '- Run: `' + process.env.GITHUB_RUN_ID + '.' + process.env.GITHUB_RUN_ATTEMPT + '`',
            '- Previous state: ' + (fs.existsSync('r23-previous.json') ? 'restored' : 'no eligible main artifact (fresh baseline)'),
            '- Source evidence accepted: ' + (summary?.source_evidence_accepted === true ? 'true' : 'false/unknown'),
            '- Sanitized state artifact: `r24-jd-main-state` (check upload step result)',
            '- Daily checkpoint status: ' + (process.env.GITHUB_REF === 'refs/heads/main' ? 'see dailycheck/dailyupload steps' : 'not-main'),
            '- Exact broadcast starts, ends and formal opening rate: NOT VERIFIED',
            '- The next automatic cron run must be verified separately; a push smoke run does not prove cron.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          JS
      - name: Gate true source/persistence success after evidence upload
        if: always() && steps.window.outputs.should_run == 'true'
        shell: bash
        run: |
          echo "Restore: ${{ steps.restore.outcome }}; source: ${{ steps.source.outcome }}; accept: ${{ steps.accepted.outcome }}; state: ${{ steps.state.outcome }}"
          if test "${{ steps.restore.outcome }}" != success || test "${{ steps.source.outcome }}" != success || test "${{ steps.accepted.outcome }}" != success || test "${{ steps.state.outcome }}" != success || test "${{ steps.dailycheck.outcome }}" != success || { test "${{ steps.dailycheck.outputs.should_upload }}" = true && test "${{ steps.dailyupload.outcome }}" != success; }; then
            echo "::error::JD source, validation, or persistence failed. UNKNOWN retained; NOT OFFLINE."
            exit 1
          fi
          echo "R2.7: JD source accepted; 7-day state saved and Beijing-day checkpoint verified; formal opening rate remains NULL"
