name: R3.1 JD scheduled background monitor (7-day rolling only)
# MAIN-branch state isolation; scan implementation is SHA-pinned and read-only.
# No Pages/site files altered. No repository write permissions.
on:
  push:
    branches:
      - main
      - release/r23-jd-scheduler-only
    paths:
      - '.github/workflows/jd-r23-scheduled.yml'
  pull_request:
    paths:
      - '.github/workflows/jd-r23-scheduled.yml'
  workflow_dispatch:
  # Allow a backup scheduler to invoke this exact vetted read-only monitor.
  workflow_call:
    inputs:
      backup_mode:
        description: Recheck MAIN state under the shared serial monitor lock before backup source access
        type: boolean
        required: false
        default: false
    secrets:
      TCL_OPS_BASE_URL:
        required: false
  schedule:
    # +2 minute offset avoids the top-of-hour schedule load.
    - cron: '2,7,12,17,32,47,57 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: r23-jd-stateful-monitor
  cancel-in-progress: false
jobs:
  verify-launcher:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 267b6709a8563ef779cda6b11c97b9684c4e1c16
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned-source state machine and safety guards
        run: node --test tests/*.test.mjs
  verify-restore-isolation:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify MAIN-only artifact selection with adversarial fixtures
        run: node --test tests/r24-main-artifact-restore.test.mjs tests/r26-jd-main-smoke.test.mjs tests/r27-jd-main-restore.test.mjs tests/r31-jd-seven-day-only.test.mjs tests/r32-jd-schedule-gap.test.mjs tests/r34-jd-backup-atomic-recheck.test.mjs
  inspect:
    # A main-branch smoke scan is allowed only for a labelled one-time release commit.
    # Normal main pushes and all pull requests cannot access source or persist state.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[jd-main-smoke]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TCL_OPS_BASE_URL: ${{ secrets.TCL_OPS_BASE_URL || 'http://101.96.215.251' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 267b6709a8563ef779cda6b11c97b9684c4e1c16
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce Beijing 06:30 to 02:00 window
        id: window
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {isOperatingTime,beijingClock} from './probes/r23/jd-window.mjs';
          const scheduled=process.env.GITHUB_EVENT_NAME==='schedule';
          const due=!scheduled||isOperatingTime(new Date());
          const clock=beijingClock(new Date());
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'should_run='+String(due)+'\n');
          console.log(JSON.stringify({scheduled,should_run:due,beijing_hour:clock.hour,beijing_minute:clock.minute,
            cron_offset_minutes:2,timetable:'06:30-02:00 BJT, shifted +2m, GitHub cron best effort'}));
          JS
      - name: Restore latest 7-day rolling state from Actions artifact
        id: restore
        if: steps.window.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=r24-jd-main-state&per_page=100" --jq '.artifacts | map(select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.repository_id != null and .workflow_run.repository_id == .workflow_run.head_repository_id)) | sort_by(.created_at) | last | .id // empty')
          if test -n "$artifact_id"; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > prior-state.zip
            unzip -p prior-state.zip r23-state.json > r23-previous.json
            unzip -p prior-state.zip r23-summary.json > r23-previous-summary.json
            node --input-type=module -e "import fs from 'node:fs';import {validateState} from './probes/r23/jd-history.mjs';const s=validateState(JSON.parse(fs.readFileSync('r23-previous.json','utf8')));if(!s.last_processed_run||!s.last_checked_at)throw Error('MAIN_PRIOR_STATE_HAS_NO_RUN');console.log(JSON.stringify({restored:true,origin:'MAIN_ONLY_ARTIFACT',last_processed_run:s.last_processed_run,last_checked_at:s.last_checked_at,room_count:Object.keys(s.rooms).length,stored_checks:s.checks.length,stored_events:s.events.length}));"
          else
            echo "No eligible MAIN-branch state artifact; experimental artifacts were not imported."
          fi
      # The backup preflight occurs outside the source monitor's shared lock.
      # A primary scan can complete while backup waits. Check AGAIN after
      # restore and after the serialized workflow has acquired the lock.
      - name: Confirm reusable backup invocation is MAIN only
        if: inputs.backup_mode == true && steps.window.outputs.should_run == 'true' && steps.restore.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_REPOSITORY}" = "lijianjun004-star/tcl-live-monitor"
      - name: Checkout pinned MAIN backup freshness decision only
        if: inputs.backup_mode == true && steps.window.outputs.should_run == 'true' && steps.restore.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .r34-backup-policy
          sparse-checkout: |
            probes/r33/jd-backup-freshness.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Recheck backup freshness after shared MAIN state lock
        id: lock_recheck
        if: inputs.backup_mode == true && steps.window.outputs.should_run == 'true' && steps.restore.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node .r34-backup-policy/probes/r33/jd-backup-freshness.mjs --state r23-previous.json --summary r23-previous-summary.json --output "$GITHUB_OUTPUT"
          echo "Backup lock recheck completed. Only an expired/unsuccessful MAIN scan can reach the JD source."
      - name: One authorized TCL OPS source scan (no retries)
        id: source
        if: steps.window.outputs.should_run == 'true' && steps.restore.outcome == 'success' && (inputs.backup_mode != true || steps.lock_recheck.outputs.should_run == 'true')
        continue-on-error: true
        run: node probes/tcl-jd-all.mjs --shard-index 0 --shard-total 1 --output r23-source-safe.json
      - name: Validate one scan (partial directory stays partial)
        id: accepted
        if: steps.window.outputs.should_run == 'true' && steps.restore.outcome == 'success' && (inputs.backup_mode != true || steps.lock_recheck.outputs.should_run == 'true')
        continue-on-error: true
        run: |
          if test -f r23-source-safe.json; then
            node probes/r21/accept-cli.mjs r23-source-safe.json r23-accepted.json
          else
            echo '{"schema_version":21,"readiness":"BLOCKED","reason":"SOURCE_REPORT_MISSING","rooms":[],"formal_opening_rate_percent":null}' > r23-accepted.json
            exit 3
          fi
      - name: Carry state forward; mark failed/unknown signals UNKNOWN
        id: state
        if: steps.window.outputs.should_run == 'true' && steps.restore.outcome == 'success' && (inputs.backup_mode != true || steps.lock_recheck.outputs.should_run == 'true')
        run: |
          node probes/r23/run-history.mjs --report r23-accepted.json --previous r23-previous.json --state-output r23-state.json --summary-output r23-summary.json --run-id "${{ github.run_id }}.${{ github.run_attempt }}"
      - name: Upload rolling history and sanitized snapshot
        if: always() && steps.window.outputs.should_run == 'true' && steps.state.outcome == 'success' && (inputs.backup_mode != true || steps.lock_recheck.outputs.should_run == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: r24-jd-main-state
          path: |
            r23-state.json
            r23-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Write safe run proof to Actions job summary
        if: always() && steps.window.outputs.should_run == 'true'
        shell: bash
        env:
          BACKUP_LOCK_RECHECK_REASON: ${{ steps.lock_recheck.outputs.reason || 'NOT_BACKUP' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let summary = null;
          try { summary = JSON.parse(fs.readFileSync('r23-summary.json','utf8')); }
          catch { /* No data: provenance stays unknown. */ }
          // Audit expected Beijing-window cron opportunities since the last
          // persisted MAIN observation. An expected slot is NOT a verified run.
          let priorAt=null;
          try {
            const prior=JSON.parse(fs.readFileSync('r23-previous.json','utf8'));
            const parsed=Date.parse(prior.last_checked_at);
            if(Number.isFinite(parsed)) priorAt=parsed;
          } catch { /* Absence is UNKNOWN; never a negative stream signal. */ }
          const nowMs=Date.now();
          const minuteSlots=[2,7,12,17,32,47,57];
          let expectedOpportunities=null;
          if(priorAt!==null && nowMs>=priorAt && nowMs-priorAt<=7*86400000){
            expectedOpportunities=0;
            const startMinute=Math.floor(priorAt/60000)+1;
            const endMinute=Math.floor(nowMs/60000);
            for(let t=startMinute;t<=endMinute;t++){
              const bj=new Date(t*60000+8*3600000);
              const localMinute=bj.getUTCHours()*60+bj.getUTCMinutes();
              if((localMinute>=390||localMinute<=120)&&minuteSlots.includes(bj.getUTCMinutes()))expectedOpportunities++;
            }
          }
          const gapMinutes=priorAt===null?null:Math.max(0,Math.round((nowMs-priorAt)/60000));
          if(process.env.GITHUB_EVENT_NAME==='schedule' && expectedOpportunities!==null && expectedOpportunities>=3){
            console.log('::warning::JD SAMPLING_GAP: '+expectedOpportunities+' nominal Beijing operating-window cron opportunities since prior persisted scan; this is missing sampling, NOT evidence of OFFLINE');
          }
          const lines = [
            '## JD R3.2 main-chain execution and sampling-gap proof',
            '- Previous persisted scan gap (elapsed minutes): ' + (gapMinutes===null?'UNKNOWN':String(gapMinutes)),
            '- Expected Beijing operating-window cron opportunities since prior scan: ' + (expectedOpportunities===null?'UNKNOWN':String(expectedOpportunities)) + ' (GitHub best-effort, not guaranteed runs)',
            '- Event: `' + process.env.GITHUB_EVENT_NAME + '`',
            '- Branch: `' + process.env.GITHUB_REF + '`',
            '- Run: `' + process.env.GITHUB_RUN_ID + '.' + process.env.GITHUB_RUN_ATTEMPT + '`',
            '- Previous state: ' + (fs.existsSync('r23-previous.json') ? 'restored' : 'no eligible main artifact (fresh baseline)'),
            '- Previous run ID: `' + (()=>{try{return JSON.parse(fs.readFileSync('r23-previous.json','utf8')).last_processed_run||'none'}catch{return 'none'}})() + '`',
            '- Source evidence accepted: ' + (summary?.source_evidence_accepted === true ? 'true' : 'false/unknown'),
            '- Backup serialized recheck reason: ' + process.env.BACKUP_LOCK_RECHECK_REASON,
            '- Sanitized state artifact: `r24-jd-main-state` (check upload step result)',
            '- Exact broadcast starts, ends and formal opening rate: NOT VERIFIED',
            '- The next automatic cron run must be verified separately; a push smoke run does not prove cron.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          JS
      - name: Gate true source/persistence success after evidence upload
        if: always() && steps.window.outputs.should_run == 'true' && (inputs.backup_mode != true || steps.lock_recheck.outputs.should_run == 'true')
        shell: bash
        run: |
          echo "Restore: ${{ steps.restore.outcome }}; source: ${{ steps.source.outcome }}; accept: ${{ steps.accepted.outcome }}; state: ${{ steps.state.outcome }}"
          if test "${{ steps.restore.outcome }}" != success || test "${{ steps.source.outcome }}" != success || test "${{ steps.accepted.outcome }}" != success || test "${{ steps.state.outcome }}" != success; then
            echo "::error::JD source, validation, or persistence failed. UNKNOWN retained; NOT OFFLINE."
            exit 1
          fi
          echo "R3.1: JD source accepted, MAIN state restored and 7-day rolling history uploaded; formal opening rate remains NULL"
