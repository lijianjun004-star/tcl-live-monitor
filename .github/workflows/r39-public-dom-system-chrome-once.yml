name: R3.9 system Chrome real public DOM - one shot
on:
  push:
    branches:
      - experiment/r39-rpa-system-chrome-real-20261111
    paths:
      - '.github/workflows/r39-public-dom-system-chrome-once.yml'
permissions:
  contents: read
jobs:
  one-shot-public-dom:
    if: github.ref == 'refs/heads/experiment/r39-rpa-system-chrome-real-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify safety regression
        run: node --test tests/r39-rpa-dom-signal.test.mjs tests/r37-rpa-safe-douyin.test.mjs
      - name: Install JS library only
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1
      - name: Confirm installed Chrome available
        run: node probes/r39/system-chrome-smoke.mjs
      - name: Inspect two approved public profiles once with zero authentication
        env:
          R39_SINGLE_SHOT: SAFE_DOM_DIAGNOSTIC_SYSTEM_CHROME
        run: node probes/r39/run-real-dom-system-chrome-once.mjs
      - name: Upload only minimized counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r39-system-chrome-public-dom-safe
          path: out/r39/public-dom-system-chrome-summary.json
          retention-days: 2
          if-no-files-found: ignore
