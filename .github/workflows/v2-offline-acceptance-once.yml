name: Dispatch V2 offline acceptance once
on:
  push:
    branches: [codex/v2-acceptance-fake-6805af9]
    paths: ['.github/workflows/v2-offline-acceptance-once.yml']
permissions:
  actions: write
jobs:
  dispatch-fake:
    if: github.event.before == '4f9e2a9416e858335a2170974c86fd811dd3d595'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Dispatch only the fake engine on the reviewed feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/425072647/dispatches" \
            -f ref='feat/v2-modular-architecture' \
            -f 'inputs[engine]=fake' -f 'inputs[fail_on_canary]=true'
