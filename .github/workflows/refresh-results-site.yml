name: Refresh results site after collection (dispatches publish.yml in tcl-live-results)
# User instruction 2026-11-16 (Beijing): refresh the results site automatically when collection finishes,
# so the refresh no longer depends on GitHub cron in the results repo or on any assistant session.
# Runs only after a collection workflow on main has completed (success or failure, including runs that
# skipped sampling during the 24-hour cooldown). Its helper makes exactly one dispatch API call:
# POST workflow_dispatch for publish.yml in lijianjun004-star/tcl-live-results.
# It never touches collection code, ledgers, cooldown markers, Douyin, Tmall/Taobao or JD.
# Needs the repository secret RESULTS_DISPATCH_TOKEN (fine-grained token, tcl-live-results only,
# Actions: read and write). Without the secret the run prints a notice and ends successfully.
on:
  workflow_run:
    workflows:
      # GitHub reads these names as glob patterns, where + is special; \+ matches the literal plus sign.
      # Single quotes keep the backslash (a double-quoted YAML string would reject \+).
      - 'Douyin daily broadcast check (4 scoring \+ 3 monitor-only accounts, read-only public guest)'
      - "Tmall/Taobao daily broadcast check (registered shops, read-only public guest)"
      - "JD fixed-window full-broadcast rate (08:00-24:00 Beijing, read-only)"
      # V2 runs, including those pressed by the external clock, so the results page follows each round.
      - "TCL V2 monitor"
    types: [completed]
  workflow_dispatch:
  # The two triggers below exist so GitHub parses this file on every change: a pull request shows a
  # skipped run (the file is valid), and the merge to main runs the dispatch once as a self-check.
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-results-site.yml'
      - 'scripts/dispatch-results.sh'
  pull_request:
    paths:
      - '.github/workflows/refresh-results-site.yml'
      - 'scripts/dispatch-results.sh'
permissions:
  contents: read
concurrency:
  group: refresh-results-site
  cancel-in-progress: false
jobs:
  dispatch:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || (github.event_name != 'workflow_run' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Ask tcl-live-results to publish once
        id: results-dispatch
        env:
          # The owner stored the token under the name CLAUDECODE; either name works.
          RESULTS_DISPATCH_TOKEN: ${{ secrets.RESULTS_DISPATCH_TOKEN || secrets.CLAUDECODE }}
          RESULTS_COLLECTOR_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          RESULTS_DISPATCH_RUN_ID: ${{ github.run_id }}
        run: bash scripts/dispatch-results.sh
