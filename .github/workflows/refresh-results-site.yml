name: Refresh results site after collection (dispatches publish.yml in tcl-live-results)
# User instruction 2026-11-16 (Beijing): refresh the results site automatically when collection finishes,
# so the refresh no longer depends on GitHub cron in the results repo or on any assistant session.
# Runs only after a collection workflow on main has completed (success or failure, including runs that
# skipped sampling during the 24-hour cooldown). It makes exactly one API call and nothing else:
# POST workflow_dispatch for publish.yml in lijianjun004-star/tcl-live-results.
# It never touches collection code, ledgers, cooldown markers, Douyin, Tmall/Taobao or JD.
# Needs the repository secret RESULTS_DISPATCH_TOKEN (fine-grained token, tcl-live-results only,
# Actions: read and write). Without the secret the run prints a notice and ends successfully.
on:
  workflow_run:
    workflows:
      - "Douyin daily broadcast check (4 scoring + 3 monitor-only accounts, read-only public guest)"
      - "Tmall/Taobao daily broadcast check (registered shops, read-only public guest)"
      - "JD fixed-window full-broadcast rate (08:00-24:00 Beijing, read-only)"
    types: [completed]
  workflow_dispatch:
permissions: {}
concurrency:
  group: refresh-results-site
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ask tcl-live-results to publish once
        env:
          RESULTS_DISPATCH_TOKEN: ${{ secrets.RESULTS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RESULTS_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::RESULTS_DISPATCH_TOKEN is not set; the results site was not refreshed by this run."
            exit 0
          fi
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${RESULTS_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lijianjun004-star/tcl-live-results/actions/workflows/publish.yml/dispatches \
            -d '{"ref":"main"}')
          if [ "$code" = 204 ]; then
            echo "R334_RESULTS_REFRESH {\"dispatched\":true}"
          else
            echo "::error::publish.yml dispatch was refused (HTTP $code). Check that RESULTS_DISPATCH_TOKEN is valid, covers tcl-live-results and has Actions read and write."
            head -c 300 resp.txt || true
            exit 1
          fi
