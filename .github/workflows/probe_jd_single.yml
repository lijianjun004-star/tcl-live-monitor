name: JD single room anonymous probe

on:
  push:
    branches: ['experiment/jd-living-live-id-20261120']
    paths: ['.github/workflows/probe_jd_single.yml']
  workflow_dispatch:
    inputs:
      room_url:
        description: Public JD Live PC room URL
        required: false
        type: string
      record_history:
        description: Append accepted observations to state_history.jsonl
        required: false
        type: boolean
        default: false
      history_run_id:
        description: Earlier run on this branch whose history should be continued
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: jd-single-room-anonymous-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ROOM_URL: ${{ inputs.room_url || 'https://lives.jd.com/#/49620440' }}
      RECORD_HISTORY: ${{ inputs.record_history }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate evidence rules offline
        run: python src/single_room_probe.py --self-test
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Restore chosen observation history
        if: ${{ inputs.record_history && inputs.history_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_RUN_ID: ${{ inputs.history_run_id }}
        run: |
          [[ "$HISTORY_RUN_ID" =~ ^[0-9]{1,20}$ && "$HISTORY_RUN_ID" != "$GITHUB_RUN_ID" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HISTORY_RUN_ID" |
            jq -e --arg branch "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" '
              .head_branch == $branch and .head_repository.full_name == $repo
              and .path == ".github/workflows/probe_jd_single.yml"
              and .status == "completed" and .conclusion == "success"
            ' >/dev/null
          history_dir="$(mktemp -d "$RUNNER_TEMP/jd-history.XXXXXX")"
          gh run download "$HISTORY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name jd-single-room-anonymous --dir "$history_dir"
          test -f "$history_dir/state_history.jsonl"
          cp "$history_dir/state_history.jsonl" "$RUNNER_TEMP/jd-state-history.jsonl"
      - name: Observe one public room
        run: |
          if [[ "$RECORD_HISTORY" == "true" ]]; then
            history_file="$RUNNER_TEMP/jd-state-history.jsonl"
            python src/single_room_probe.py --state-history "$history_file"
            if [[ -f "$history_file" ]]; then
              cp "$history_file" output/state_history.jsonl
            fi
          else
            python src/single_room_probe.py
          fi
      - name: Compare the nominated session with a fresh anonymous context
        if: github.event_name == 'push'
        env:
          ROOM_URL: 'https://lives.jd.com/#/49654695'
        run: |
          if jq -e '.page_loaded == true and .room_id_matched == true and .login_or_captcha_blocked == false' output/result.json >/dev/null; then
            mkdir "$RUNNER_TEMP/jd-control"
            cd "$RUNNER_TEMP/jd-control"
            python "$GITHUB_WORKSPACE/src/single_room_probe.py"
          fi
      - name: Package single-run verification
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          test -s output/result.json
          mkdir review
          cp output/result.json review/result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          old = json.loads(Path('review/result.json').read_bytes())
          assert old['room_id'] == '49620440' and 'living_live_id' in old
          path = Path(os.environ['RUNNER_TEMP']) / 'jd-control/output/result.json'
          control = json.loads(path.read_bytes()) if path.exists() else None
          if control is not None:
              assert control['room_id'] == '49654695' and 'living_live_id' in control

          def admitted(row):
              return bool(row and row['page_loaded'] and row['room_id_matched']
                          and not row['login_or_captcha_blocked'] and row['live_status'] != 'unknown')

          observed_id = old['living_live_id'] if admitted(old) else None
          matches = observed_id == '49654695' if observed_id is not None else None
          control_live = control['live_status'] == 'live' if admitted(control) else None
          summary = {
              'repository': os.environ['GITHUB_REPOSITORY'], 'branch': os.environ['GITHUB_REF_NAME'],
              'sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'event': os.environ['GITHUB_EVENT_NAME'],
              'history_enabled': False, 'old_room_observed_at': old['generated_at'],
              'old_room_living_live_id_matches_49654695': matches,
              'control_live_at_its_own_observation': control_live,
              'control_result': control,
          }
          Path('review/run_summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          cd review
          sha256sum result.json run_summary.json > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload run review ZIP
        if: always() && github.event_name == 'push' && hashFiles('review/SHA256SUMS.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: JD-living-live-id-49620440-${{ github.run_id }}-${{ github.run_attempt }}
          path: review/
          if-no-files-found: error
          retention-days: 7
      - name: Upload safe evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: jd-single-room-anonymous
          path: |
            output/result.json
            output/snapshot.jpg
            output/state_history.jsonl
          if-no-files-found: warn
          retention-days: 7
