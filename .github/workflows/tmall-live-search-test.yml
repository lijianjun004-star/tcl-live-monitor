name: Taobao live search page test (one-shot, query TCL)
# Branch-scoped push trigger for one anonymous read of tbzb.taobao.com/search?searchQuery=TCL.
# No login, no challenge interaction, Alibaba hosts only. Remove after use.
on:
  push:
    branches:
      - claude/shop-livestream-access-ff953r
    paths:
      - experiments/tmall_live_search/**
      - .github/workflows/tmall-live-search-test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Read the live search page once
        env:
          PYTHONUNBUFFERED: '1'
        run: python experiments/tmall_live_search/search.py
