name: QA R3.3 one-shot backup workflow dispatch
# Single-purpose QA launcher. This second explicit opt-in invocation verifies the 8-minute duplicate suppression gate; it never mutates source or Pages.
on:
  push:
    branches:
      - qa/r33-one-shot-backup-dispatch-20261111
    paths:
      - '.github/workflows/r33-one-shot-backup-dispatch.yml'
permissions:
  actions: write
  contents: read
concurrency:
  group: qa-r33-one-shot-backup-dispatch
  cancel-in-progress: false
jobs:
  dispatch-once:
    if: github.repository == 'lijianjun004-star/tcl-live-monitor' && github.ref == 'refs/heads/qa/r33-one-shot-backup-dispatch-20261111' && contains(github.event.head_commit.message, '[jd-backup-e2e-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Request exactly one R3.3 MAIN backup workflow_dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'lijianjun004-star/tcl-live-monitor'
          echo 'Requesting one dispatch of existing MAIN R3.3 backup. No pages, source code or state mutated by this QA launcher.'
          gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/workflows/jd-r33-backup.yml/dispatches" -f ref=main
          echo 'GitHub API accepted ONE workflow_dispatch request. Actual scan/result MUST be verified from separate R3.3 run logs.'
