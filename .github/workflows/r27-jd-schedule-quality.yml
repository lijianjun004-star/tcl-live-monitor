name: R2.9 JD schedule and archive offline acceptance
on:
  push:
    branches:
      - fix/r29-jd-schedule-archive-integrated-20261111
    paths:
      - '.github/workflows/jd-r23-scheduled.yml'
      - '.github/workflows/r27-jd-schedule-quality.yml'
      - 'tests/r26-jd-main-smoke.test.mjs'
      - 'tests/r27-schedule-daily-archive.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/jd-r23-scheduled.yml'
      - '.github/workflows/r27-jd-schedule-quality.yml'
      - 'tests/r26-jd-main-smoke.test.mjs'
      - 'tests/r27-schedule-daily-archive.test.mjs'
permissions:
  contents: read
jobs:
  offline-safety-and-archive-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify main artifact isolation, smoke gate, cron and daily history
        run: node --test tests/r24-main-artifact-restore.test.mjs tests/r26-jd-main-smoke.test.mjs tests/r27-schedule-daily-archive.test.mjs
