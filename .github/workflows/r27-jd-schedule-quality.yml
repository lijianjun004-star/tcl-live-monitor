name: R3.1 JD seven-day rolling safety (offline)
on:
  push:
    branches:
      - fix/r31-jd-seven-day-only-20261111
      - main
    paths:
      - '.github/workflows/jd-r23-scheduled.yml'
      - '.github/workflows/r27-jd-schedule-quality.yml'
      - 'tests/r26-jd-main-smoke.test.mjs'
      - 'tests/r31-jd-seven-day-only.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/jd-r23-scheduled.yml'
      - '.github/workflows/r27-jd-schedule-quality.yml'
      - 'tests/r26-jd-main-smoke.test.mjs'
      - 'tests/r31-jd-seven-day-only.test.mjs'
permissions:
  contents: read
jobs:
  offline-seven-day-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify main restore, seven-day policy, schedule and Bash safety
        run: node --test tests/*.test.mjs
