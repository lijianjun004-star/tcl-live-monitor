name: R3.9 Douyin public DOM diagnostic - one shot
on:
  push:
    branches:
      - experiment/r39-rpa-real-dom-diagnostics-20261111
    paths:
      - '.github/workflows/r39-public-dom-one-shot.yml'
permissions:
  contents: read
jobs:
  one-shot-dom:
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/r39-rpa-real-dom-diagnostics-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repaired safety baseline offline
        run: node --test tests/r39-rpa-dom-signal.test.mjs tests/r37-rpa-safe-douyin.test.mjs
      - name: Install pinned Playwright without persistent package files
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: One-shot guest public DOM diagnostic, no login
        env:
          R39_SINGLE_SHOT: SAFE_DOM_DIAGNOSTIC_TWO_PUBLIC_ACCOUNTS
        run: node probes/r39/run-real-dom-once.mjs
      - name: Save minimized counters only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r39-public-dom-minimal-evidence
          path: out/r39/public-dom-diagnostic-summary.json
          retention-days: 2
          if-no-files-found: ignore
