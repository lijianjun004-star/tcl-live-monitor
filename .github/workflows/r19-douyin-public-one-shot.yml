name: R1.9 TCL + FFALCON guest one-shot (manual experiment)
on:
  push:
    branches:
      - experiment/r19-douyin-tcl-ffalcon-roster-first
    paths:
      - '.github/workflows/r19-douyin-public-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r19-douyin-public-one-shot
  cancel-in-progress: false
jobs:
  guest-public-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standard Chromium (no stealth plugins or proxy)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Execute at most two regular public profile checks, no retries
        run: node probes/r19/public-one-shot.mjs
      - name: Review sanitized one-shot status
        if: always()
        run: |
          if [ -f r19-public-pilot-output/results.json ]; then
            node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('r19-public-pilot-output/results.json'));console.log(JSON.stringify({count:r.results.length,blocked:r.platform_blocked,results:r.results.map(x=>({key:x.key,state:x.state,reason:x.failure_code,profile_badge:x.profile_live_badge_observed,room_verified:x.room_page_second_verification}))}));"
          else
            echo "No result file. Pilot is NOT_EXECUTED or FAILED; do not infer live status."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r19-tcl-ffalcon-guest-one-shot
          path: |
            r19-public-pilot-output/results.json
            r19-public-pilot-output/store-state.json
          retention-days: 14
          if-no-files-found: warn
