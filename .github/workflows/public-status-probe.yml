name: public-status-probe
# Manual, read-only public guest probe of user-approved targets.
# NO schedule/cron. NO credentials. Results are public in this repo's run logs/artifacts.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: '轮数 (1-12)'
        default: '1'
      interval_min:
        description: '每轮间隔分钟 (1-15)'
        default: '5'
permissions:
  contents: read
concurrency:
  group: public-status-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04  # pinned: playwright@1.56.1 has no Chromium build for ubuntu-latest (26.04)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (offline)
        run: node --test tests/*.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Probe
        env:
          ROUNDS: ${{ inputs.rounds }}
          INTERVAL_MIN: ${{ inputs.interval_min }}
        run: node probes/public-status-probe.mjs --rounds "$ROUNDS" --interval-min "$INTERVAL_MIN"
      - name: Job summary
        if: always()
        run: test -f probe-summary.md && cat probe-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-report
          path: |
            probe-report.json
            probe-summary.md
          retention-days: 14
          if-no-files-found: warn
