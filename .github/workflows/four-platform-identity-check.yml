name: four-platform-identity-check
# Manual read-only reverse identity check of public platform IDs (Tmall/Taobao/JD/Douyin).
# Candidates only. No cron, no credentials, stops per platform on captcha/login walls.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Identity check
        run: node probes/four-platform-identity-check.mjs
